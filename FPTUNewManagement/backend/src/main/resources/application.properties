spring.application.name=A2HanNH_SE1910
server.port=8080

# Database Configuration (MS SQL Server via Spring Data JPA)
# Environment variables DB_URL, DB_USERNAME, DB_PASSWORD can override defaults
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=A2HanNH_SE1910;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Hibernate & JPA Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=86400000
